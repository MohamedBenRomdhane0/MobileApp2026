; ============================================================
; Laravel Queue Workers — 3 pools matched to queue connections
; ============================================================

; ------------------------------------------------------------
; POOL 1: default queue
; Handles: CleanupOrphanedMediaJob, CleanupVideoFilesJob,
;          and all general dispatch() calls
; ------------------------------------------------------------
[program:worker-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work redis --queue=default --sleep=1 --tries=3 --timeout=90 --memory=256
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/queue-default.log
stopwaitsecs=120

; ------------------------------------------------------------
; POOL 2: video_merge queue
; Handles: MergeAndUploadVideoJob (merges chunked video uploads)
; Retry after 600s to allow large file merging to complete
; ------------------------------------------------------------
[program:worker-video-merge]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work redis --queue=video_merge --sleep=1 --tries=3 --timeout=600 --memory=512
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/queue-video-merge.log
stopwaitsecs=700

; ------------------------------------------------------------
; POOL 3: video_processing queue
; Handles: TranscodeVideoToHLSJob (ffmpeg HLS encoding, 720/480/360p)
;          IngestBookPdfJob (coordinator: downloads PDF, dispatches per-page jobs)
;          ProcessBookPageJob (Imagick PDF → WebP per page, parallel)
; Long timeout: ffmpeg transcoding can take many minutes; per-page jobs are capped at 300s
; ------------------------------------------------------------
[program:worker-video-processing]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work redis --queue=video_processing --sleep=1 --tries=3 --timeout=3600 --memory=1024
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/queue-video-processing.log
stopwaitsecs=3700
