include /etc/nginx/frontend-parent-upstream.conf;

##############################################################################
# HTTP — port 2060
# Reverse-proxies to the active frontend-parent container (blue or green).
# The frontend-parent React SPA calls the Laravel API directly from the
# browser via the port-80 nginx (http://<host>/api), so the same API/Laravel
# container is shared with the main frontend.
##############################################################################
server {
    listen 2060;
    listen [::]:2060;
    server_name 102.204.206.251 _;

    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               image/svg+xml;

    # nginx-level health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    ##########################################################################
    # Proxy everything to the active frontend-parent container.
    # The container itself runs nginx serving the built Vite dist with an
    # index.html SPA fallback.
    ##########################################################################
    location / {
        proxy_pass http://frontend_parent_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
    }
}
