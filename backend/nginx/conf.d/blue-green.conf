include /etc/nginx/upstream.conf;

# NOTE: CORS is handled exclusively by Laravel's HandleCors middleware
# (see config/cors.php, allowed_origins = ['*']). nginx must NOT add any
# Access-Control-* headers on PHP-proxied routes, otherwise the response
# carries duplicate Access-Control-Allow-Origin values and browsers reject it.

##############################################################################
# HTTP — port 80
# Serves React SPA on / and Laravel API on /api /sanctum /broadcasting /storage
# No SSL — access via http://102.204.206.251
##############################################################################
server {
    listen 80;
    listen [::]:80;
    server_name 102.204.206.251 _;

    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.apple.mpegurl image/svg+xml;

    # Health check endpoint (nginx itself)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    ##########################################################################
    # Laravel: API routes
    # Match both /api and /api/ (no trailing slash required)
    ##########################################################################
    location ^~ /api {
        # CORS (incl. OPTIONS preflight) is handled by Laravel HandleCors.
        root /var/www/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    ##########################################################################
    # Laravel: Sanctum / CSRF cookie
    ##########################################################################
    location ^~ /sanctum {
        root /var/www/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    ##########################################################################
    # Laravel: Broadcasting (Pusher-compatible WebSocket auth)
    ##########################################################################
    location ^~ /broadcasting {
        root /var/www/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    ##########################################################################
    # Laravel: Public storage symlink (uploaded files, images, HLS segments)
    ##########################################################################
    location ^~ /storage/ {
        alias /var/www/storage/app/public/;

        # HLS streaming MIME types
        types {
            application/vnd.apple.mpegurl  m3u8;
            video/mp2t                     ts;
            video/mp4                      mp4;
        }

        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    ##########################################################################
    # PHP-FPM handler (matched after location blocks above pass through)
    ##########################################################################
    location ~ \.php$ {
        root /var/www/public;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php_backend;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
        fastcgi_buffering off;
        # No CORS headers here — Laravel HandleCors owns CORS for PHP routes.
    }

    ##########################################################################
    # React SPA static assets (Vite content-hashed filenames — cache 1 year)
    ##########################################################################
    location ~* \.(js|css|woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        root /var/www/frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    ##########################################################################
    # React SPA — catch-all
    # Uses a named location to avoid internal redirect loops when index.html
    # is missing (e.g. before the first frontend build).
    ##########################################################################
    location / {
        root /var/www/frontend;
        try_files $uri $uri/ @spa_fallback;
    }

    location @spa_fallback {
        root /var/www/frontend;
        try_files /index.html =503;
    }

    # Block hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
