################################################
# Blue-Green Deployment Configuration
# Usage:
#   First start : docker compose -f docker-compose.blue-green.yml up -d
#   Deploy      : ./scripts/deploy-zero-downtime.sh
#   Rollback    : ./scripts/rollback.sh
################################################

services:
  ########################################
  # APP BLUE - Production Instance 1
  ########################################
  app_blue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_blue
    restart: unless-stopped
    tty: true
    env_file:
      - .env
    environment:
      SERVICE_NAME: app-blue
      SERVICE_TAGS: prod
      REDIS_HOST: redis
      PHP_UPLOAD_MAX_FILESIZE: 100M
      PHP_POST_MAX_SIZE: 100M
      APP_ENV: production
      DEPLOYMENT_COLOR: blue
    working_dir: /var/www
    volumes:
      - ./storage/app/public:/var/www/storage/app/public
      - ./storage/app/chunks:/var/www/storage/app/chunks
      - ./storage/app/temp:/var/www/storage/app/temp
      - ./storage/logs:/var/www/storage/logs
    expose:
      - "9000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 1 bash -c 'echo > /dev/tcp/127.0.0.1/9000' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s

  ########################################
  # APP GREEN - Production Instance 2
  ########################################
  app_green:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_green
    restart: unless-stopped
    tty: true
    env_file:
      - .env
    environment:
      SERVICE_NAME: app-green
      SERVICE_TAGS: prod
      REDIS_HOST: redis
      PHP_UPLOAD_MAX_FILESIZE: 100M
      PHP_POST_MAX_SIZE: 100M
      APP_ENV: production
      DEPLOYMENT_COLOR: green
    working_dir: /var/www
    volumes:
      - ./storage/app/public:/var/www/storage/app/public
      - ./storage/app/chunks:/var/www/storage/app/chunks
      - ./storage/app/temp:/var/www/storage/app/temp
      - ./storage/logs:/var/www/storage/logs
    expose:
      - "9000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 1 bash -c 'echo > /dev/tcp/127.0.0.1/9000' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s

  ########################################
  # QUEUE BLUE
  # Runs 3 supervisor worker pools:
  #   - default         (4 workers, general jobs)
  #   - video_merge     (2 workers, MergeAndUploadVideoJob)
  #   - video_processing (2 workers, TranscodeVideoToHLSJob / RenderPdfShardJob)
  ########################################
  queue_blue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: queue_blue
    restart: unless-stopped
    tty: true
    working_dir: /var/www
    env_file:
      - .env
    environment:
      DEPLOYMENT_COLOR: blue
    volumes:
      - ./storage/app/public:/var/www/storage/app/public
      - ./storage/app/chunks:/var/www/storage/app/chunks
      - ./storage/app/temp:/var/www/storage/app/temp
      - ./storage/logs:/var/www/storage/logs
    depends_on:
      app_blue:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["bash", "-c", "rm -f /etc/supervisor/conf.d/reverb.conf && supervisord -n -c /etc/supervisor/supervisord.conf"]
    networks:
      - app-network

  ########################################
  # QUEUE GREEN
  ########################################
  queue_green:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: queue_green
    restart: unless-stopped
    tty: true
    working_dir: /var/www
    env_file:
      - .env
    environment:
      DEPLOYMENT_COLOR: green
    volumes:
      - ./storage/app/public:/var/www/storage/app/public
      - ./storage/app/chunks:/var/www/storage/app/chunks
      - ./storage/app/temp:/var/www/storage/app/temp
      - ./storage/logs:/var/www/storage/logs
    depends_on:
      app_green:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["bash", "-c", "rm -f /etc/supervisor/conf.d/reverb.conf && supervisord -n -c /etc/supervisor/supervisord.conf"]
    networks:
      - app-network

  ########################################
  # FRONTEND PARENT BLUE - Production Instance 1
  # Static React/Vite SPA (abajim-frontend-parent) served by nginx.
  # Built dist is baked into the image; VITE_* env vars are compiled in
  # at build time from ../frontend-parent/.env
  ########################################
  frontend_parent_blue:
    build:
      context: ../frontend-parent
      dockerfile: Dockerfile
    container_name: frontend_parent_blue
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ########################################
  # FRONTEND PARENT GREEN - Production Instance 2
  ########################################
  frontend_parent_green:
    build:
      context: ../frontend-parent
      dockerfile: Dockerfile
    container_name: frontend_parent_green
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ########################################
  # REVERB - WebSocket Server (Shared)
  ########################################
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reverb
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    command: ["php", "/var/www/artisan", "reverb:start", "--host=0.0.0.0", "--port=8080", "--no-interaction"]
    volumes:
      - ./storage/logs:/var/www/storage/logs
    ports:
      - "6001:8080"
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  ########################################
  # SCHEDULER - Shared (no duplication needed)
  ########################################
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scheduler
    restart: unless-stopped
    tty: true
    working_dir: /var/www
    env_file:
      - .env
    volumes:
      - ./storage/logs:/var/www/storage/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    networks:
      - app-network

  ########################################
  # DB - MySQL 5.7 (Shared)
  ########################################
  db:
    image: mysql:5.7
    container_name: db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - app-network
    ports:
      - "3306:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p${MYSQL_ROOT_PASSWORD} || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  ########################################
  # REDIS - Shared
  ########################################
  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    environment:
      REDIS_PORT: 6379
      REDIS_DATABASES: 16
    volumes:
      - redisdata:/data
    networks:
      - app-network
    ports:
      - "6379:6379"
    healthcheck:
      test:
        ["CMD-SHELL", "redis-cli -h 127.0.0.1 ping | grep -q PONG || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ########################################
  # NGINX - Load Balancer + SPA Server
  # Serves:
  #   port 80   → main React SPA + Laravel API (blue-green)
  #   port 2060 → frontend-parent React SPA (blue-green, proxied to container)
  ########################################
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    volumes:
      - ./nginx/conf.d/blue-green.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/conf.d/frontend-parent.conf:/etc/nginx/conf.d/frontend-parent.conf:ro
      - ./nginx/upstream.conf:/etc/nginx/upstream.conf:ro
      - ./nginx/frontend-parent-upstream.conf:/etc/nginx/frontend-parent-upstream.conf:ro
      - ./:/var/www
      - ../frontend/dist:/var/www/frontend:ro
    ports:
      - "80:80"
      - "2060:2060"
    networks:
      - app-network
    depends_on:
      - app_blue
      - frontend_parent_blue
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ########################################
  # PHPMYADMIN - Database Management
  ########################################
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks:
      - app-network
    ports:
      - "6090:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
  redisdata:

networks:
  app-network:
    driver: bridge
